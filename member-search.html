<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>회원 검색 연습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E2A47; --bg:#FBF8F1; --card:#FFFDF8; --sub:#44586E; --line:#C9D3DC;
    --sky:#A9D8F0; --sky2:#E1F1FA; --yellow:#F7DC7A; --green:#BFDD9C; --apricot:#FFBE9F;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans KR',sans-serif;font-size:16px;line-height:1.5}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
  h1{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:28px;margin:4px 0 4px}
  .lead{color:var(--sub);margin:0 0 20px;font-size:14px}
  .card{background:var(--card);border:1.5px solid var(--ink);border-radius:16px;padding:16px;margin-bottom:16px}
  h2{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:20px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .badge{font-family:'IBM Plex Sans KR',sans-serif;font-size:13px;font-weight:700;background:var(--yellow);border:1.5px solid var(--ink);border-radius:999px;padding:0 10px;line-height:24px}
  .row{display:flex;gap:8px}
  input{flex:1;min-width:0;min-height:44px;border:1.5px solid var(--ink);border-radius:12px;padding:0 12px;font:inherit;color:var(--ink);background:#fff}
  input:focus{outline:3px solid var(--sky)}
  button{min-height:44px;border:1.5px solid var(--ink);border-radius:12px;background:var(--sky);color:var(--ink);font:inherit;font-weight:700;padding:0 16px;cursor:pointer;white-space:nowrap}
  button:disabled{background:var(--line);color:var(--sub);cursor:default}
  button.ghost{background:var(--card)}
  button.add{background:var(--green)}
  button.remove{background:var(--apricot)}
  .hint{font-size:13px;color:var(--sub);margin:8px 0 0}
  .msg{margin-top:10px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--ink);font-size:14px;display:none}
  .msg.show{display:block}
  .msg.ok{background:var(--sky2)} .msg.err{background:var(--apricot)} .msg.info{background:var(--yellow)}
  ul{list-style:none;margin:12px 0 0;padding:0}
  li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  li:first-child{border-top:none}
  .who{flex:1;min-width:0}
  .name{font-weight:700}
  .meta{font-size:13px;color:var(--sub);overflow-wrap:anywhere}
  .empty{color:var(--sub);font-size:14px;padding:6px 0}
  .saved{font-size:13px;color:var(--sub);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>회원 검색 연습</h1>
  <p class="lead">생명선앱스 회원검색 API로 이름을 찾아 명단에 추가해 보는 연습 페이지입니다. 명단은 이 기기에만 저장됩니다.</p>

  <section class="card">
    <h2>1. 로그인 hash</h2>
    <div class="row">
      <input id="hash" type="text" placeholder="hash 붙여넣기" autocomplete="off" spellcheck="false">
      <button id="saveHash" class="ghost">저장</button>
    </div>
    <p class="hint">생명선앱스 문서의 회원 검색 테스트 칸에 있는 hash를 복사해 붙여넣으세요. 만료되면 새 값으로 바꾸면 됩니다.</p>
    <div id="hashSaved" class="saved"></div>
  </section>

  <section class="card">
    <h2>2. 이름 검색</h2>
    <form id="searchForm" class="row">
      <input id="q" type="search" placeholder="예: 주신욱 또는 일산 주신욱" autocomplete="off">
      <button id="searchBtn" type="submit">검색</button>
    </form>
    <p class="hint">이름은 2글자 이상. 교회명을 붙이려면 "교회명 이름" 순서로 쓰세요.</p>
    <div id="msg" class="msg"></div>
    <ul id="results"></ul>
  </section>

  <section class="card">
    <h2>3. 내 명단 <span id="count" class="badge">0명</span></h2>
    <ul id="roster"></ul>
  </section>
</div>

<script>
const HASH_KEY = 'jbch_practice_hash';
const ROSTER_KEY = 'jbch_practice_roster';
const $ = (id) => document.getElementById(id);

function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let roster = load(ROSTER_KEY, []);
let lastResults = [];

/* hash */
function showHashState() {
  const h = load(HASH_KEY, '');
  $('hash').value = h;
  $('hashSaved').textContent = h ? '저장됨' : '아직 저장된 hash가 없습니다.';
}
$('saveHash').addEventListener('click', () => {
  save(HASH_KEY, $('hash').value.trim());
  showHashState();
});

/* 메시지 */
function showMsg(text, type) {
  const m = $('msg');
  m.textContent = text;
  m.className = 'msg show ' + type;
}
function hideMsg() { $('msg').className = 'msg'; }

function friendlyError(result) {
  const r = String(result || '');
  if (r.includes('Not_certification')) return '인증 실패: 발급 키(JBCH_TOKEN) 또는 프로그램명이 맞지 않습니다.';
  if (r.includes('Empty hash')) return 'hash가 비어 있습니다. 1번에 hash를 저장해 주세요.';
  if (r.includes('Hash not found')) return 'hash가 만료되었거나 틀립니다. 문서 페이지에서 새 hash를 복사해 저장해 주세요.';
  return '오류: ' + (r || '알 수 없는 오류');
}

/* 검색 */
$('searchForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const hash = $('hash').value.trim() || load(HASH_KEY, '');
  const q = $('q').value.trim();
  if (!hash) { showMsg('먼저 1번에 hash를 붙여넣고 저장해 주세요.', 'err'); return; }
  if (!q) { showMsg('검색할 이름을 입력해 주세요.', 'err'); return; }
  if (hash !== load(HASH_KEY, '')) { save(HASH_KEY, hash); showHashState(); }

  $('searchBtn').disabled = true;
  showMsg('검색 중...', 'info');
  $('results').innerHTML = '';
  try {
    const res = await fetch('/jbch-member', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ hash, q }),
    });
    const data = await res.json();
    if (data.status === 'ok') {
      lastResults = Array.isArray(data.result) ? data.result : [];
      showMsg(`${data.count}명 찾았습니다.` + (data.count >= 50 ? ' 결과가 많으니 교회명을 붙여 다시 검색해 보세요.' : ''), 'ok');
      renderResults();
    } else if (data.status === 'not') {
      lastResults = [];
      showMsg('찾는 회원이 없습니다. 이름을 다시 확인해 주세요.', 'info');
    } else {
      lastResults = [];
      showMsg(friendlyError(data.result), 'err');
    }
  } catch (err) {
    showMsg('서버에 연결하지 못했습니다. 잠시 후 다시 시도해 주세요.', 'err');
  } finally {
    $('searchBtn').disabled = false;
  }
});

function inRoster(userid) { return roster.some(p => p.userid === userid); }

function renderResults() {
  $('results').innerHTML = lastResults.map((p, i) => `
    <li>
      <div class="who">
        <div class="name">${esc(p.name)} <span class="meta">${esc(p.sex)}</span></div>
        <div class="meta">${esc(p.church)} · ${esc(p.userid)}</div>
      </div>
      <button class="add" data-i="${i}" ${inRoster(p.userid) ? 'disabled' : ''}>${inRoster(p.userid) ? '추가됨' : '추가'}</button>
    </li>`).join('');
}
$('results').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-i]');
  if (!b) return;
  const p = lastResults[+b.dataset.i];
  if (!p || inRoster(p.userid)) return;
  roster.push({ userid: p.userid, name: p.name, sex: p.sex, church: p.church, churchid: p.churchid });
  save(ROSTER_KEY, roster);
  renderResults();
  renderRoster();
});

/* 명단 */
function renderRoster() {
  $('count').textContent = roster.length + '명';
  $('roster').innerHTML = roster.length
    ? roster.map((p, i) => `
      <li>
        <div class="who">
          <div class="name">${esc(p.name)} <span class="meta">${esc(p.sex)}</span></div>
          <div class="meta">${esc(p.church)} · ${esc(p.userid)}</div>
        </div>
        <button class="remove" data-r="${i}">빼기</button>
      </li>`).join('')
    : '<li class="empty">아직 추가한 사람이 없습니다. 위에서 검색해 추가해 보세요.</li>';
}
$('roster').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-r]');
  if (!b) return;
  roster.splice(+b.dataset.r, 1);
  save(ROSTER_KEY, roster);
  renderRoster();
  renderResults();
});

showHashState();
renderRoster();
</script>
</body>
</html>
